preset: validation_robust_single_point
force_field: amber99sb-star-ildn-mut
water_model: tip3p
allow_charge_changing: true
temperature_k: 300.0
pressure_bar: 1.0
nvt_ps: 500
npt_ps: 500
equilibration_restraint_schedule: staged_backbone_release
equilibration_release_npt_ps: 500
# Patel 2021 used a much longer equilibrium production trajectory before
# launching nonequilibrium transitions. abag-rbfep still uses an equilibrium
# lambda-window BAR workflow, so this file is a literature-inspired reference
# rather than a literal reproduction of their snapshot-transition protocol.
production_ps: 40000
equilibration_pressure_coupling: Parrinello-Rahman
equilibration_pressure_tau_ps: 2.0
equilibration_refcoord_scaling: com
sampling_pressure_coupling: Parrinello-Rahman
sampling_pressure_tau_ps: 2.0
sampling_refcoord_scaling: com
gmx_bin: /mnt/data/liuchao/platform/gromacs-abag-mmgbsa/tools/gromacs-gpu/bin/gmx
pmx_bin: pmx
allow_external_execute: true
box_type: dodecahedron
box_padding_nm: 1.0
equilibrate_retry_box_padding_nm: 2.0
equilibrate_emergency_box_padding_nm: 5.0
salt_concentration_m: 0.15
mdrun_args: -ntmpi 1 -ntomp 4
